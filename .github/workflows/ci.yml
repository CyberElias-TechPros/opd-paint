name: CI

# Everything the project claims is checked here, on every push. A green badge
# that nobody runs is worse than no badge, so this mirrors `npm run check`
# exactly — same scripts, same order.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site — lint, tests, routes, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and content tests
        run: npm run test:unit

      - name: Enquiry service tests
        run: npm run test:server

      - name: Every route renders
        run: npm run test:routes

      - name: Production build
        run: npm run build

      - name: Check the build is self-contained
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/media/og-card.jpg
          test -f dist/documents/opudas-matt-tds.pdf
          test -f dist/documents/opudas-fan-deck.pdf
          test -f dist/sw.js
          test -f dist/offline.html
          echo "build artefacts present"

      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: app/dist
          retention-days: 7

  assets:
    name: Brand assets are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install fonttools brotli fpdf2 Pillow

      - name: Regenerate icons, social card, documents and sitemap
        working-directory: app
        run: |
          npm ci
          cd ..
          node tools/build-sitemap.mjs
          python3 tools/build-documents.py
          python3 tools/build-icons.py
          python3 tools/build-og.py
          python3 tools/build-fandeck.py

      - name: The committed artefacts match the scripts
        run: git diff --exit-code -- app/public/sitemap.xml app/public/documents app/public/brand app/public/media/og-card.jpg
