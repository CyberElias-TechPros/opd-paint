# Gradle 8.7: the version AGP 8.5 requires, and the version the wrapper jar in
# this directory came from (gradle/gradle at tag v8.7.0).
#
# `distributionSha256Sum` is deliberately absent. Pinning it is the right thing
# to do and needs the published checksum, which lives on services.gradle.org —
# add it the first time this project is built somewhere that can reach that
# host, and the wrapper will then refuse a tampered distribution.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
