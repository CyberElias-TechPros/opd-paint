# Gradle runs the Kotlin compiler and AAPT2 in one JVM; 2 GB is what a Compose
# build of this size wants, and the CI runner has it.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off deliberately: the asset-sync task reads paths
# outside this build (../../app/public), and a task that is correct but not
# cacheable should not be forced to pretend otherwise.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
