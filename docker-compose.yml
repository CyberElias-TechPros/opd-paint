# A single service, a named volume for enquiry data, and health checks.
#
#   docker compose up -d --build
#
# Set the inbox credentials in .env (never in this file) before the first run.
services:
  web:
    build: .
    image: opudas-paint:latest
    restart: unless-stopped
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      OPD_STATIC_DIR: /srv/opudas/app/dist
      OPD_DATA_DIR: /srv/opudas/data
      # Leave these empty to disable the enquiry inbox entirely.
      OPD_ADMIN_USER: ${OPD_ADMIN_USER:-}
      OPD_ADMIN_PASSWORD: ${OPD_ADMIN_PASSWORD:-}
    volumes:
      - enquiries:/srv/opudas/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  enquiries:
