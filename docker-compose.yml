# A single service, a named volume for enquiry data, and health checks.
#
#   docker compose up -d --build
#
# Set the inbox credentials in .env (never in this file) before the first run.
services:
  web:
    build: .
    image: opudas-paint:latest
    restart: unless-stopped
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      OPD_STATIC_DIR: /srv/opudas/app/dist
      OPD_DATA_DIR: /srv/opudas/data
      # Leave these empty to disable the enquiry inbox entirely.
      OPD_ADMIN_USER: ${OPD_ADMIN_USER:-}
      OPD_ADMIN_PASSWORD: ${OPD_ADMIN_PASSWORD:-}
      # Notifications: an enquiry that nobody is told about is a lead lost
      # politely. Set at least one channel — see docs/operations.md.
      OPD_NOTIFY_WEBHOOK: ${OPD_NOTIFY_WEBHOOK:-}
      OPD_RESEND_API_KEY: ${OPD_RESEND_API_KEY:-}
      OPD_NOTIFY_EMAIL: ${OPD_NOTIFY_EMAIL:-}
      OPD_NOTIFY_FROM: ${OPD_NOTIFY_FROM:-}
      # Optional error forwarding; errors are written to the data volume either way.
      OPD_SENTRY_DSN: ${OPD_SENTRY_DSN:-}
      OPD_RELEASE: ${OPD_RELEASE:-}
      OPD_LOG_LEVEL: ${OPD_LOG_LEVEL:-info}
    volumes:
      - enquiries:/srv/opudas/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  enquiries:
