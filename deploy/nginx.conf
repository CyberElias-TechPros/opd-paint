# Optional front end for the static build.
#
# Use this when a real web server should own TLS, compression and caching. The
# enquiry service still runs separately on 127.0.0.1:8787 — the browser only ever
# talks to this origin, so /api is proxied and nothing needs a CORS rule.
#
#   /etc/nginx/sites-available/opudapaint.conf

server {
    listen 443 ssl http2;
    server_name opudapaint.com www.opudapaint.com;

    root /srv/opudas/app/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/opudapaint.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opudapaint.com/privkey.pem;

    # TLS defaults that are still current in 2026.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Content-hashed bundles never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Photography and PDFs are replaced by re-running the asset scripts.
    location ~* \.(webp|jpg|jpeg|png|woff2|pdf|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
    }

    # The inbox is not for the public internet. Keep it on the private network,
    # or delete these two blocks and reach it over a VPN.
    location /admin {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # The router is client-side, so an unknown path is the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    server_name opudapaint.com www.opudapaint.com;
    return 301 https://$host$request_uri;
}
